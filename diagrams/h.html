<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="d.css"></head>
<body>
<div class="canvas">
  <div class="hd">
    <div class="mk">智</div>
    <div class="t1">智巡 SmartOps 系统层次结构图</div>
    <div class="t2">H · H I E R A R C H Y</div>
  </div>

  <div class="band">
    <div class="blabel b-user">用户层</div>
    <div class="boxes">
      <div class="bx">运维管理员<span class="s">资源/规则/编排</span></div>
      <div class="bx">值班工程师<span class="s">告警处置</span></div>
      <div class="bx">应用开发者<span class="s">测试环境自查</span></div>
      <div class="bx">运维负责人<span class="s">报表与审批</span></div>
    </div>
  </div>

  <div class="arrow">▼ ▼ ▼</div>

  <div class="band">
    <div class="blabel b-app">应用层</div>
    <div class="boxes">
      <div class="bx hi">资源纳管</div>
      <div class="bx hi">巡检编排</div>
      <div class="bx hi">监控与检测</div>
      <div class="bx hi">告警中心</div>
      <div class="bx hi">自愈与工单</div>
      <div class="bx hi">报表中心</div>
      <div class="bx hi">系统管理</div>
    </div>
  </div>

  <div class="arrow">▼ ▼ ▼</div>

  <div class="band">
    <div class="blabel b-svc">支撑层</div>
    <div class="boxes">
      <div class="bx hi2 sm">采集引擎</div>
      <div class="bx hi2 sm">调度编排引擎</div>
      <div class="bx hi2 sm">异常检测引擎</div>
      <div class="bx hi2 sm">告警归并引擎</div>
      <div class="bx hi2 sm">自愈执行器</div>
      <div class="bx hi2 sm">权限与审计</div>
      <div class="bx hi2 sm">开放 API</div>
    </div>
  </div>

  <div class="arrow">▼ ▼ ▼</div>

  <div class="band">
    <div class="blabel b-dat">数据层</div>
    <div class="boxes">
      <div class="bx hi3 sm">时序库 TDengine</div>
      <div class="bx hi3 sm">关系库 MySQL</div>
      <div class="bx hi3 sm">缓存 Redis</div>
      <div class="bx hi3 sm">消息队列 Kafka</div>
      <div class="bx hi3 sm">对象存储 MinIO</div>
    </div>
  </div>

  <div class="arrow">▼ ▼ ▼</div>

  <div class="band">
    <div class="blabel b-inf">资源层</div>
    <div class="boxes">
      <div class="bx sm">多云主机</div>
      <div class="bx sm">K8s 集群</div>
      <div class="bx sm">中间件</div>
      <div class="bx sm">数据库</div>
      <div class="bx sm">网络设备</div>
    </div>
  </div>
</div>
</body></html>
